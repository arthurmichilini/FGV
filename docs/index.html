<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Milheiro</title>
  <meta name="description" content="Otimize assinaturas, benefícios, cartões e milhas em um só lugar.">
  <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Milheiro">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">

  <link rel="apple-touch-startup-image" href="icons/splash-1206x2622.png" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">

  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app"></div>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-backdrop" data-act="sheet-close"></div>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-grip"></div>
      <div class="sheet-head">
        <span></span>
        <h2 id="sheet-title" class="sheet-title"></h2>
        <button class="icon-btn sheet-x" data-act="sheet-close" aria-label="Fechar"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
      <div id="sheet-body" class="sheet-body"></div>
    </div>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="js/catalog.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/phone.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
